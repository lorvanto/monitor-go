name: monitor-go
services:
  monitor:
    image: ${MONITOR_IMAGE:-monitor-go:local}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${MONITOR_BIND_ADDRESS:-127.0.0.1}:${MONITOR_PORT:-5080}:5080"
    volumes:
      - monitor-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    command:
      - -data=/data
      - -listen=:5080
      - -collect-host=${MONITOR_COLLECT_HOST:-false}
      - -public-url=${MONITOR_PUBLIC_URL:-}
      - -secure-cookie=${MONITOR_SECURE_COOKIE:-false}
      - -trusted-proxy=${MONITOR_TRUSTED_PROXY:-}
volumes:
  monitor-data:
